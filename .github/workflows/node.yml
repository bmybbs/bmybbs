name: BMYBBS Frontend

on:
  push:
    paths:
      - ".github/workflows/node.yml"
      - "web/**"
      - "content-parser"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/node.yml"
      - "web/**"
      - "content-parser"
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Build front-end
        working-directory: web
        run: npm run build
