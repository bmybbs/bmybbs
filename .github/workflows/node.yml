name: BMYBBS Frontend

on:
  push:
    paths:
      - ".github/workflows/node.yml"
      - "web/**"
      - "content-parser"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/node.yml"
      - "web/**"
      - "content-parser"
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Build front-end
        working-directory: web
        run: npm run build
